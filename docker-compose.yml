# -----------------------------------------------------------------------------
# Kontext pro AgenticSeek / agenty (načti při startu workspace)
# -----------------------------------------------------------------------------
# Projekt: Mamka Reality
# O čem: Osobní web realitní makléřky Jitky Jedličkové (ČR), statický marketing.
# Cíl: Pastva pro oči a zážitek — jeden z nejhezčích realitních webů.
# Stack: Next.js 15 (standalone), React 18, Tailwind 4, Framer Motion.
# Plný kontext: přečti PROJECT.md v kořeni tohoto repa.
# -----------------------------------------------------------------------------

services:
  web:
    build: .
    ports:
      - "4180:3000"
    # Stejné proměnné jako u `next dev` — musí obsahovat DEEPSEEK_API_KEY pro /api/chat
    env_file:
      - .env.local
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:4180}
    # Vynutit bind na 3000 i když .env.local obsahuje PORT (na Windows Dockeru občas nepřebije env_file)
    command: ["/bin/sh", "-c", "export PORT=3000 HOSTNAME=0.0.0.0; exec node server.js"]
